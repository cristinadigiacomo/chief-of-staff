<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chief of Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chief of Staff">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --surface: #1a1a1a;
    --surface-raised: #202020;
    --border: #2e2e2e;
    --border-light: #3a3a3a;
    --text: #f2f2ef;
    --text-faint: #9a9a9a;
    --mint: #5fe3a8;
    --mint-dim: #2d5c48;
    --amber: #d4a24c;
    --amber-dim: #4a3d20;
    --rose: #c1666b;
    --font-display: 'IBM Plex Mono', 'Courier New', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  header {
    padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: #ffffff;
  }
  .conn-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-display);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    background: var(--surface);
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .conn-status.connected .conn-dot { background: var(--mint); }
  .conn-status.error .conn-dot { background: var(--rose); }

  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.agent { justify-content: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 13px 17px;
    border-radius: 14px;
    font-size: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble-row.user .bubble {
    background: #ffffff;
    color: #12141c;
    border-bottom-right-radius: 4px;
  }
  .bubble-row.agent .bubble {
    background: var(--mint);
    color: #08130f;
    font-weight: 500;
    border-bottom-left-radius: 4px;
  }

  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 13px 16px;
    width: fit-content;
  }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); animation: typing-pulse 1.1s ease-in-out infinite; }
  .typing-dot:nth-child(2) { background: var(--amber); animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-pulse { 0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); } 30% { opacity: 1; transform: scale(1); } }
  .typing-label {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--text-faint);
    margin-left: 6px;
  }

  .confirm-card {
    background: var(--amber-dim);
    border: 1px solid var(--amber);
    border-radius: 10px;
    padding: 14px 16px;
    max-width: 82%;
  }
  .confirm-title {
    font-family: var(--font-display);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .confirm-detail { font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }
  .confirm-actions { display: flex; gap: 8px; }
  .btn-confirm, .btn-cancel {
    flex: 1;
    padding: 9px 12px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
  }
  .btn-confirm { background: var(--amber); color: #1a1200; }
  .btn-cancel { background: transparent; border: 1px solid var(--border-light); color: var(--text-faint); }

  .connect-banner {
    margin: 16px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .connect-banner p { font-size: 14px; color: var(--text-faint); margin-bottom: 12px; }
  .btn-connect {
    background: var(--mint);
    color: #0a1a13;
    border: none;
    padding: 11px 20px;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: pointer;
  }

  #inputBar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 14px;
    margin-bottom: calc(40px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-light);
    flex-shrink: 0;
    background: var(--surface);
  }
  #textInput {
    flex: 1;
    background: #ffffff;
    border: 1px solid var(--border-light);
    color: #12141c;
    padding: 15px 18px;
    font-size: 17px;
    border-radius: 24px;
    outline: none;
    font-family: var(--font-body);
    min-width: 0;
  }
  #textInput::placeholder { color: #6b6b6b; }
  #textInput:focus { border-color: var(--mint); }

  .icon-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1.5px solid #6b6b6b;
    background: var(--surface-raised);
    color: #e8e8e8;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn.active { background: var(--mint-dim); border-color: var(--mint); color: var(--mint); }
  .icon-btn.recording { background: var(--rose); border-color: var(--rose); color: #fff; animation: rec-pulse 1s ease-in-out infinite; }
  @keyframes rec-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .icon-btn.send { background: var(--mint); border-color: var(--mint); color: #0a1a13; font-size: 22px; }
</style>
</head>
<body>

<header>
  <h1>Chief of Staff</h1>
  <div class="conn-status" id="connStatus">
    <span class="conn-dot"></span>
    <span id="connLabel">Checking…</span>
  </div>
</header>

<div id="chatLog"></div>

<div id="inputBar">
  <button class="icon-btn" id="voiceOutBtn" title="Read replies aloud">&#128266;</button>
  <input type="text" id="textInput" placeholder="Ask or tell me anything…">
  <button class="icon-btn" id="micBtn" title="Voice input">&#127908;</button>
  <button class="icon-btn send" id="sendBtn" title="Send">&#10148;</button>
</div>

<script>
  const WORKER_URL = 'https://chief-of-staff-api.cristina-e17.workers.dev';

  let messages = JSON.parse(localStorage.getItem('cos-messages') || '[]');
  let connected = false;
  let voiceOutEnabled = false;

  const chatLog = document.getElementById('chatLog');
  const textInput = document.getElementById('textInput');

  function saveMessages() {
    localStorage.setItem('cos-messages', JSON.stringify(messages));
  }

  function renderHistory() {
    chatLog.innerHTML = '';
    messages.forEach(m => {
      if (m.role === 'user' && typeof m.content === 'string') {
        addBubble('user', m.content, false);
      } else if (m.role === 'assistant') {
        const text = (m.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
        if (text) addBubble('agent', text, false);
      }
    });
    scrollToEnd();
  }

  function addBubble(role, text, scroll = true) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatLog.appendChild(row);
    if (scroll) scrollToEnd();
    return row;
  }

  function scrollToEnd() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  let typingRow = null;
  function showTyping(label) {
    hideTyping();
    typingRow = document.createElement('div');
    typingRow.className = 'bubble-row agent';
    typingRow.innerHTML = `
      <div class="typing-bubble">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        <span class="typing-label">${label}</span>
      </div>
    `;
    chatLog.appendChild(typingRow);
    scrollToEnd();
  }
  function hideTyping() {
    if (typingRow) { typingRow.remove(); typingRow = null; }
  }

  // Real speech via the Worker's OpenAI-backed /speak endpoint (the "onyx"
  // voice) instead of the phone's built-in, robotic-sounding system voice.
  // Streamed via a GET src (not fetch+blob) so playback can start on the
  // first chunk instead of waiting for the whole clip to download.
  let currentAudio = null;
  function speak(text) {
    if (!voiceOutEnabled || !text) return;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    currentAudio = new Audio(WORKER_URL + '/speak?text=' + encodeURIComponent(text));
    const playPromise = currentAudio.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(err => console.error('Voice playback blocked or failed:', err));
    }
  }

  // ---------- Connection status ----------
  async function checkStatus() {
    const el = document.getElementById('connStatus');
    const label = document.getElementById('connLabel');
    try {
      const r = await fetch(WORKER_URL + '/status');
      const data = await r.json();
      connected = !!data.connected;
      el.className = 'conn-status ' + (connected ? 'connected' : '');
      label.textContent = connected ? 'Connected' : 'Not connected';
      renderConnectBanner();
    } catch (e) {
      el.className = 'conn-status error';
      label.textContent = 'Offline';
    }
  }

  function renderConnectBanner() {
    const existing = document.getElementById('connectBanner');
    if (connected) { if (existing) existing.remove(); return; }
    if (existing) return;
    const banner = document.createElement('div');
    banner.className = 'connect-banner';
    banner.id = 'connectBanner';
    banner.innerHTML = `
      <p>Connect your Google account so I can read and manage your apps, Gmail, Calendar, and Drive.</p>
      <button class="btn-connect" id="connectGoogleBtn">Connect Google</button>
    `;
    chatLog.parentNode.insertBefore(banner, chatLog);
    document.getElementById('connectGoogleBtn').addEventListener('click', () => {
      window.open(WORKER_URL + '/oauth/start', '_blank');
    });
  }

  document.getElementById('connStatus').addEventListener('click', checkStatus);

  // ---------- Sending messages ----------
  async function sendMessage(text) {
    if (!text.trim()) return;
    textInput.value = '';
    messages.push({ role: 'user', content: text });
    addBubble('user', text);
    saveMessages();
    await runTurn();
  }

  async function runTurn(confirmedAction) {
    showTyping(confirmedAction ? 'Working on it…' : 'Thinking…');
    try {
      const resp = await fetch(WORKER_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, confirmedAction })
      });
      const data = await resp.json();
      hideTyping();

      if (data.error === 'NOT_CONNECTED') {
        connected = false;
        renderConnectBanner();
        addBubble('agent', 'I need Google access first — tap "Connect Google" above.');
        return;
      }
      if (data.error) {
        addBubble('agent', 'Something went wrong: ' + data.error);
        return;
      }

      messages = data.messages;
      saveMessages();

      if (data.confirmationRequired) {
        if (data.text) addBubble('agent', data.text);
        showConfirmCard(data);
        speak(data.text || 'I need your confirmation before I do that.');
        return;
      }

      if (data.done) {
        addBubble('agent', data.text);
        speak(data.text);
      }
    } catch (e) {
      hideTyping();
      addBubble('agent', 'Could not reach the server — check your connection.');
    }
  }

  function showConfirmCard(data) {
    const row = document.createElement('div');
    row.className = 'bubble-row agent';
    const card = document.createElement('div');
    card.className = 'confirm-card';
    card.innerHTML = `
      <div class="confirm-title">Needs your OK</div>
      <div class="confirm-detail">${escapeHtml(describeAction(data.toolName, data.toolInput))}</div>
      <div class="confirm-actions">
        <button class="btn-cancel">Cancel</button>
        <button class="btn-confirm">Confirm</button>
      </div>
    `;
    card.querySelector('.btn-confirm').addEventListener('click', () => {
      card.remove();
      runTurn({ toolUseId: data.toolUseId, approved: true });
    });
    card.querySelector('.btn-cancel').addEventListener('click', () => {
      card.remove();
      runTurn({ toolUseId: data.toolUseId, approved: false });
    });
    row.appendChild(card);
    chatLog.appendChild(row);
    scrollToEnd();
  }

  function describeAction(toolName, input) {
    if (toolName === 'send_email') return `Send an email to ${input.to}\nSubject: ${input.subject}\n\n${input.body}`;
    if (toolName === 'delete_calendar_event') return `Delete calendar event: ${input.summary || input.eventId}`;
    if (toolName === 'delete_drive_file') return `Delete file: ${input.name || input.fileId}`;
    return toolName + ': ' + JSON.stringify(input);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  document.getElementById('sendBtn').addEventListener('click', () => sendMessage(textInput.value));
  textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(textInput.value); });

  // ---------- Voice input ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    let listening = false;
    micBtn.addEventListener('click', () => {
      if (listening) { recognition.stop(); return; }
      recognition.start();
    });
    recognition.addEventListener('start', () => { listening = true; micBtn.classList.add('recording'); });
    recognition.addEventListener('end', () => { listening = false; micBtn.classList.remove('recording'); });
    recognition.addEventListener('result', (e) => {
      const transcript = e.results[0][0].transcript;
      sendMessage(transcript);
    });
    recognition.addEventListener('error', () => { listening = false; micBtn.classList.remove('recording'); });
  } else {
    micBtn.style.display = 'none';
  }

  // ---------- Voice output toggle ----------
  document.getElementById('voiceOutBtn').addEventListener('click', () => {
    voiceOutEnabled = !voiceOutEnabled;
    document.getElementById('voiceOutBtn').classList.toggle('active', voiceOutEnabled);
    if (!voiceOutEnabled && currentAudio) { currentAudio.pause(); currentAudio = null; }
  });

  // ---------- Proactive opening check-in ----------
  const STATIC_GREETING = "Hey, I'm Chip — your Chief of Staff. Ask me to add, update, or look up anything across your apps, Gmail, Calendar, or Drive.";

  async function sendProactiveGreeting() {
    if (!connected) { addBubble('agent', STATIC_GREETING); return; }
    showTyping('Checking in…');
    try {
      const resp = await fetch(WORKER_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{
            role: 'user',
            content: 'Give me a quick opening check-in — look across all my apps for anything pending, close to deadline, or overdue, then say hello. Keep it short and natural, and only mention specifics that are actually there.'
          }]
        })
      });
      const data = await resp.json();
      hideTyping();
      if (data.done && data.text) {
        addBubble('agent', data.text);
        speak(data.text);
      } else {
        addBubble('agent', STATIC_GREETING);
      }
    } catch (e) {
      hideTyping();
      addBubble('agent', STATIC_GREETING);
    }
    // Deliberately not saved into `messages`/localStorage — this is a fresh
    // glance each time you open to an empty chat, not part of the thread.
  }

  // ---------- Init ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  renderHistory();
  checkStatus().then(() => {
    if (messages.length === 0) sendProactiveGreeting();
  });
</script>
</body>
</html>
